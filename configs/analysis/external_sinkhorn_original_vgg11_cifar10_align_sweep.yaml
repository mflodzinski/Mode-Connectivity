defaults: []

experiment_name: "external_sinkhorn_original_vgg11_cifar10_align_sweep"
vgg_name: "VGG11"

model_a_checkpoint: "VGG11_cifar10_0.911.pth"
model_b_checkpoint: "VGG11_cifar10_0.9139.pth"
base_output_root: "results/vgg11/cifar10/raw_pth_align_sweep_joint_huge"

data_path: "./data"
seed: 0
split_seed: 1
num_workers: 4

image_size: 32
val_fraction: 0.1
batch_size: 1000
num_eval_points: 50

sinkhorn_iters: 20
identity_init: false
scale_invariant: true
lambda_scale: 1e-3
finetune_mode: "joint"
best_eval_interval: 5
validation_alpha_grid: [0.5]
starting_alignment_artifact: null
starting_permutation_kind: hard
device: "auto"
log_interval: 5
start_index: 0
end_index: null
continue_on_error: true

sweep:
  alignment_iterations:
    - 150
  loss_name:
    - "midpoint"
  tau:
    - 1.0
    - 0.8
  lr:
    - 0.08
    - 0.05
  sinkhorn_l:
    - 1.0
  lambda_scale:
    - 5e-3
    - 3e-3


