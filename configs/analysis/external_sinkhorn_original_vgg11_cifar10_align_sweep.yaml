defaults: []

experiment_name: "external_sinkhorn_original_vgg13_cifar10_align_sweep"
vgg_name: "VGG13"

model_a_checkpoint: "external/pytorch-vgg-cifar10/save_vgg13_seed0/model_final_state_dict.pth"
model_b_checkpoint: "external/pytorch-vgg-cifar10/save_vgg13_seed1/model_final_state_dict.pth"
base_output_root: "results/vgg13/cifar10/raw_pth_align_sweep_joint_hugev2"

data_path: "./data"
seed: 0
split_seed: 1
num_workers: 4

image_size: 32
val_fraction: 0.1
batch_size: 1000
num_eval_points: 50

sinkhorn_iters: 20
identity_init: false
scale_invariant: false
lambda_scale: 0.0
finetune_mode: "joint"
best_eval_interval: 5
validation_alpha_grid: [0.5]
starting_alignment_artifact: null
starting_permutation_kind: hard
device: "auto"
log_interval: 10
start_index: 0
end_index: null
continue_on_error: true

sweep:
  alignment_iterations:
    - 100
  loss_name:
    - "midpoint"
    - "dist_l2"
    - "random"
  tau:
    - 1.5
    - 1.0
  lr:
    - 0.1
    - 0.08
  sinkhorn_l:
    - 1.0



