defaults: []

experiment_name: "external_sinkhorn_original_train_align_vgg16_mnist_sweep"
base_output_root: "results/vgg16/mnist/original_sinkhorn_vgg16_train_align_sweep"

data_path: "./data"
use_small_dataset: true
validation_size: 1000
image_size: 32
num_workers: 4
split_seed: 1

model_a_seed: 0
model_b_seed: 1
alignment_seed: 0

train_batch_size: 1000
eval_batch_size: 1000
train_epochs: 50
train_lr: 0.1

num_eval_points: 25
plot_filename: "comparison.png"
device: "auto"

sinkhorn_iters: 20
identity_init: false
log_interval: 5
start_index: 0
end_index: null
continue_on_error: true

sweep:
  alignment_epochs:
    - 50
  loss_name:
    - "random"
    - "dist_l2"
  tau:
    - 0.5
    - 0.25
  lr:
    - 0.1
    - 0.03
  sinkhorn_l:
    - 1.0
    - 2.0
