defaults: []

experiment_name: "external_sinkhorn_original_vgg11_cifar10_train"
output_root: "results/vgg11/cifar10/original_sinkhorn_lmc"

data_path: "./data"
seed: 0
split_seed: 1
num_workers: 4

val_fraction: 0.1
batch_size: 128
train_epochs: 150
train_lr: 0.0008
momentum: 0.9
weight_decay: 2e-4
scheduler_name: "multistep"
scheduler_milestones: [50, 80]
scheduler_gamma: 0.2
early_stopping_patience: 25
min_delta: 0.0005
image_size: 32

device: "auto"
