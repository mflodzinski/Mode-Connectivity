defaults: []

experiment_name: "external_sinkhorn_original_lmc_vgg16_cifar10_sweep_seed0_seed1"

model_a_checkpoint: "results/vgg16/cifar10/endpoints/standard/seed0/checkpoints/checkpoint-200.pt"
model_b_checkpoint: "results/vgg16/cifar10/endpoints/standard/seed1/checkpoints/checkpoint-200.pt"
base_output_root: "results/vgg16/cifar10/alignment/external_sinkhorn_original_lmc_sweep/seed0-seed1"

dataset: "CIFAR10"
data_path: "./data"
seed: 0
num_workers: 4

alignment_batch_size: 128
calibration_size: 5000
evaluation_batch_size: 128
num_eval_points: 21

sinkhorn_iters: 50
identity_init: false
device: "auto"
log_interval: 25
plot_filename: "comparison.png"
start_index: 0
end_index: null
continue_on_error: true

sweep:
  alignment_epochs:
    - 300
  loss_name:
    - "random"
  tau:
    - 0.5
    - 0.25
  lr:
    - 0.01
  sinkhorn_l:
    - 1.0
    - 2.0
