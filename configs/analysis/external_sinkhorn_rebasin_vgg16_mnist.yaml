defaults: []

experiment_name: "external_sinkhorn_rebasin_vgg16_mnist_seed0_seed1"

model_a_checkpoint: "results/vgg16/mnist/endpoints/standard/seed0/checkpoint-50.pt"
model_b_checkpoint: "results/vgg16/mnist/endpoints/standard/seed1/checkpoint-50.pt"
output_root: "results/vgg16/mnist/alignment/external_sinkhorn_rebasin/seed0-seed1"

dataset: "MNIST"
data_path: "./data"
seed: 0
num_workers: 4

alignment_steps: 500
alignment_batch_size: 128
calibration_size: 2048

lr: 1.0e-1
tau: 1.0
sinkhorn_iters: 20
sinkhorn_l: 1.0
identity_init: true
train_objective: "midpoint"
midpoint_alpha: 0.5
train_alpha_grid:
  - 0.25
  - 0.5
  - 0.75
device: "auto"
log_interval: 25
log_eval_batches: 4
log_alpha_grid:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0

evaluation_batch_size: 128
num_eval_points: 21
plot_filename: "comparison.png"
