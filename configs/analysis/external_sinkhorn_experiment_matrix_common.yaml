defaults: []

experiment_name: "external_sinkhorn_experiment_matrix"
base_output_root: "results/sinkhorn_experiment_matrix"

dataset: "CIFAR10"
vgg_name: "VGG11"
data_path: "./data"

seed: 0
split_seed: 1
num_workers: 4

val_fraction: 0.1
batch_size: 1000
image_size: 32
num_eval_points: 50

device: "auto"
identity_init: false
sinkhorn_iters: 20
best_eval_interval: 2
validation_alpha_grid: [0.25, 0.5, 0.75]
early_stopping_patience: 0
early_stopping_min_delta: 0.0
starting_permutation_kind: "raw"
warm_start_selection: "val_loss"
permutation_only_root: null
continue_on_error: true
log_interval: 5

endpoint_models:
  - name: "model0"
    checkpoint: null
  - name: "model1"
    checkpoint: null
  - name: "model2"
    checkpoint: null
