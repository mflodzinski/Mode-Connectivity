defaults: []

experiment_name: "external_sinkhorn_original_vgg16_mnist_align_sweep"

model_a_checkpoint: "results/vgg16/mnist/original_sinkhorn_lmc/model_a.pt"
model_b_checkpoint: "results/vgg16/mnist/original_sinkhorn_lmc/model_b.pt"
base_output_root: "results/vgg16/mnist/original_sinkhorn_lmc_align_sweep"

data_path: "./data"
seed: 0
split_seed: 1
num_workers: 4

image_size: 32
val_fraction: 0.1
batch_size: 1000
num_eval_points: 50

sinkhorn_iters: 20
identity_init: false
device: "auto"
log_interval: 1
start_index: 0
end_index: null
continue_on_error: true

sweep:
  alignment_iterations:
    - 20
  loss_name:
    - "dist_l2"
  tau:
    - 0.5
    - 0.25
  lr:
    - 0.01
  sinkhorn_l:
    - 1.0
