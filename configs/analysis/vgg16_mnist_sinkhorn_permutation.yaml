defaults: []

experiment_name: "vgg16_mnist_sinkhorn_permutation_seed0_seed1"

model_a_checkpoint: "results/vgg16/mnist/endpoints/standard/seed0/checkpoints/checkpoint-50.pt"
model_b_checkpoint: "results/vgg16/mnist/endpoints/standard/seed1/checkpoints/checkpoint-50.pt"
output_root: "results/vgg16/mnist/alignment/sinkhorn_permutation/seed0-seed1"

methods:
  - "perm_only"

dataset: "MNIST"
data_path: "./data"
seed: 0
num_workers: 4

alpha_grid_train:
  - 0.25
  - 0.5
  - 0.75

num_eval_points: 21

alignment_steps: 500
alignment_batch_size: 128
calibration_size: 2048

lr: 1.0e-2
tau: 1.0
sinkhorn_iters: 20
lambda_scale: 1.0e-5
device: "auto"
log_interval: 25

evaluation_batch_size: 128
max_eval_batches: null
plot_filename: "comparison.png"
