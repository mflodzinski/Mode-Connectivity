defaults: []

experiment_name: "external_sinkhorn_original_vgg_mnist_align_sweep"
vgg_name: "VGG11"

model_a_checkpoint: "results/vgg11/mnist/original_sinkhorn_lmc/model_a.pt"
model_b_checkpoint: "results/vgg11/mnist/original_sinkhorn_lmc/model_b.pt"
base_output_root: "results/vgg11/mnist/original_sinkhorn_lmc_align_sweep"

data_path: "./data"
seed: 0
split_seed: 1
num_workers: 4

image_size: 32
val_fraction: 0.1
batch_size: 1000
num_eval_points: 50

sinkhorn_iters: 20
identity_init: false
scale_invariant: false
lambda_scale: 1e-3
finetune_mode: "joint"
best_eval_interval: 2
validation_alpha_grid: [0.25, 0.5, 0.75]
starting_alignment_artifact: null
starting_permutation_kind: raw
device: "auto"
log_interval: 5
start_index: 0
end_index: null
continue_on_error: true

sweep:
  alignment_iterations:
    - 150
  loss_name:
    - "midpoint"
  tau:
    - 1.0
  lr:
    - 0.1
  sinkhorn_l:
    - 1.0
