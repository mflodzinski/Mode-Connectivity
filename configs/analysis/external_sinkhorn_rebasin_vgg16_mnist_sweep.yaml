defaults: []

experiment_name: "external_sinkhorn_rebasin_vgg16_mnist_sweep_seed0_seed1"

model_a_checkpoint: "results/vgg16/mnist/endpoints/standard/seed0/checkpoint-50.pt"
model_b_checkpoint: "results/vgg16/mnist/endpoints/standard/seed1/checkpoint-50.pt"
base_output_root: "results/vgg16/mnist/alignment/external_sinkhorn_rebasin_sweep/seed0-seed1"

dataset: "MNIST"
data_path: "./data"
seed: 0
num_workers: 4

alignment_batch_size: 128
calibration_size: 2048
evaluation_batch_size: 128
num_eval_points: 21

train_objective: "random_t"
midpoint_alpha: 0.5
train_alpha_grid:
  - 0.25
  - 0.5
  - 0.75

identity_init: true
device: "auto"
log_interval: 25
log_eval_batches: 4
log_alpha_grid:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0

plot_filename: "comparison.png"
start_index: 0
end_index: null
continue_on_error: true

sweep:
  alignment_steps:
    - 500
    - 1000
    - 2000
  tau:
    - 1.0
  lr:
    - 0.03
    - 0.1
    - 0.3
    - 1.0
  sinkhorn_l:
    - 1.0
