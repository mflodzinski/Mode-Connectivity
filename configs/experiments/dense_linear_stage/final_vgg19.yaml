# @package _global_
defaults:
  - final_vgg11
  - _self_

model: VGG19
# VGG19's deeper float32 evaluation accumulates slightly more roundoff under
# exact positive-scale symmetries than the shallower VGGs.  The largest
# observed discrepancy was 2.70e-5 in one of 10,000 logits, so use a 5e-5
# numerical-equivalence guard.  This changes the frozen protocol and therefore
# deliberately writes to a new root instead of mutating the existing run.
atol: 0.00005
output_root: results/final_alignment_vgg19_cifar10_atol5e5
source_roots:
  "0": results/training_stage_vgg19_final
  "1": results/training_stage_vgg19_final
  "2": results/training_stage_vgg19_final
  "3": results/training_stage_vgg19_final
  "4": results/training_stage_vgg19_final
  "5": results/training_stage_vgg19_final
reuse: {wm_sources: [], use_hyperparameter_priors: false}
