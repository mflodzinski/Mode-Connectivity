# @package _global_
output_root: results/fashion_mnist_mlp10x512
data_root: data
device: cuda
workers: 1
torch_threads: 1

# Exactly 10 hidden ReLU layers: 784 -> 512 x 10 -> 10.
hidden_layers: 10
hidden_width: 512

# The three-hidden-layer FMNIST protocol of Ito et al. uses Adam, lr=1e-3,
# batch 512, 100 epochs, and no scheduler. We retain that training recipe while
# adopting the requested deeper architecture. No data augmentation is used.
epochs: 100
train_batch_size: 512
eval_batch_size: 1000
lr: 0.001
adam_betas: [0.9, 0.999]
weight_decay: 0.0

seed_pairs: [[0, 1], [2, 3], [4, 5]]
# Only initialization and the final endpoint are retained by the paper workflow.
checkpoints: [0, 100]
split_seed: 2027
validation_size: 5000
alignment_size: 5000
train_eval_size: 2000
selection_size: 1000
test_eval_size: 10000
train_full_data: false

# REPAIR's FFCV notebook uses 72.9404/255 and 90.0212/255.
data_mean: 0.2860407843137255
data_std: 0.3530243137254902

reference:
  repair_paper: https://openreview.net/forum?id=gU5sJ6ZggcX
  repair_code: https://github.com/KellerJordan/REPAIR
  multi_model_lmc_paper: https://openreview.net/pdf/9d4174448944f5ca997041ff6ce3c5fd0b70f3ae.pdf
  note: hybrid protocol; exact architecture requested here, training defaults from the recent FMNIST MLP study

defaults: []
