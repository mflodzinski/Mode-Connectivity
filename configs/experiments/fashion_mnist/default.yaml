# @package _global_
output_root: results/fashion_mnist_mlp10x512
data_root: data
device: cuda
workers: 1
torch_threads: 1

# Exactly 10 hidden ReLU layers: 784 -> 512 x 10 -> 10.
hidden_layers: 10
hidden_width: 512

# The three-hidden-layer FMNIST protocol of Ito et al. uses Adam, lr=1e-3,
# batch 512, 100 epochs, and no scheduler. We retain that training recipe while
# adopting the requested deeper architecture. No data augmentation is used.
epochs: 100
train_batch_size: 512
eval_batch_size: 1000
lr: 0.001
adam_betas: [0.9, 0.999]
weight_decay: 0.0

seed_pairs: [[0, 1], [2, 3], [4, 5]]
# Match the VGG training-stage protocol's 16 saved checkpoints, while using a
# monotone sparse schedule because this 100-epoch Adam run has no LR drops.
# Every saved checkpoint is analyzed; early training is sampled most densely.
stages: [0, 1, 2, 3, 4, 5, 7, 10, 15, 20, 30, 40, 55, 70, 85, 100]
checkpoints: [0, 1, 2, 3, 4, 5, 7, 10, 15, 20, 30, 40, 55, 70, 85, 100]
split_seed: 2027
validation_size: 5000
alignment_size: 5000
train_eval_size: 2000
selection_size: 1000
test_eval_size: 10000
train_full_data: false

# REPAIR's FFCV notebook uses 72.9404/255 and 90.0212/255.
data_mean: 0.2860407843137255
data_std: 0.3530243137254902

# Weight matching gives the hard permutation. Positive log-scales are then
# optimized with that permutation frozen, preserving the endpoint function.
wm_sweeps: 100
alignment_seed: 1729
alignment_batch_size: 1000
scale_passes: 50
scale_lr: 0.01
scale_regularization: 0.001
scale_log_clip: 5.0
validation_interval: 5
validation_alphas: [0.0, 0.25, 0.5, 0.75, 1.0]
atol: 0.0001
rtol: 0.0001

# Separate final-endpoint comparison: WM, Sinkhorn, and Sinkhorn+scale.
# Sinkhorn is optimized first; the scale branch freezes its selected hard
# Hungarian projection and refines only exact positive ReLU scales.
final_alignment_subdir: final_alignment
sinkhorn_passes: 100
sinkhorn_lr: 0.1
sinkhorn_weight_decay: 0.01
sinkhorn_l: 1.0
sinkhorn_tau: 1.0
sinkhorn_iters: 20
sinkhorn_min_passes: 20
sinkhorn_patience: 4
sinkhorn_min_delta: 0.0001

# Raw-endpoint quadratic Bezier path; no permutation or scaling is applied.
nonlinear_passes: 25
nonlinear_batch_size: 512
nonlinear_lr: 0.01
nonlinear_momentum: 0.9
path_seed: 2718

eval_points: 31

reference:
  repair_paper: https://openreview.net/forum?id=gU5sJ6ZggcX
  repair_code: https://github.com/KellerJordan/REPAIR
  multi_model_lmc_paper: https://openreview.net/pdf/9d4174448944f5ca997041ff6ce3c5fd0b70f3ae.pdf
  note: hybrid protocol; exact architecture requested here, training defaults from the recent FMNIST MLP study

defaults: []
