defaults: []

experiment_name: "garipov_vgg16_lmc_connected_8split"
output_root: "results/vgg16/cifar10/endpoints/lmc_connected_8split"

dataset: "CIFAR10"
data_path: "./data"
transform: "VGG"
model: "VGG16"

# Stage 1: Train from scratch for shared_epochs
shared_epochs: 8           # Train together for 8 epochs
shared_seed: 42            # Seed for shared training phase

# Stage 2: Split training from shared_epochs to final_epochs (192 more epochs)
final_epochs: 200          # Train to convergence
split_seeds: [0, 1]        # Different seeds for w_0 and w_1

save_intermediate: true
save_freq: 50
lr: 0.05
wd: 5e-4
use_test: true

use_wandb: true
project_name: "thesis-mode-connectivity"
