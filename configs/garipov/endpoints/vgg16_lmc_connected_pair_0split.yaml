defaults: []

experiment_name: "garipov_vgg16_lmc_connected_0split"
output_root: "results/vgg16/cifar10/endpoints/lmc_connected_0split"

dataset: "CIFAR10"
data_path: "./data"
transform: "VGG"
model: "VGG16"

# Stage 1: No shared training (0 epochs)
shared_epochs: 0           # No shared training
shared_seed: 42            # Seed for initialization only

# Stage 2: Independent training from scratch (200 epochs each)
final_epochs: 200          # Train to convergence
split_seeds: [0, 1]        # Different seeds for w_0 and w_1

save_intermediate: true
save_freq: 50
lr: 0.05
wd: 5e-4
use_test: true

use_wandb: true
project_name: "thesis-mode-connectivity"
