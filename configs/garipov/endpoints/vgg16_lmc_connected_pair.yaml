defaults: []

experiment_name: "garipov_vgg16_lmc_connected"
output_root: "results/vgg16/cifar10/endpoints/lmc_connected"

dataset: "CIFAR10"
data_path: "./data"
transform: "VGG"
model: "VGG16"

# Shared checkpoint to resume from
shared_checkpoint: "results/vgg16/cifar10/endpoints/standard/seed1/checkpoints/checkpoint-150.pt"
shared_epochs: 150         # Epoch of the shared checkpoint
shared_seed: 42            # Seed for reproducibility

# Split training: continue from shared_epochs to final_epochs
final_epochs: 200          # Train to convergence (50 more epochs)
split_seeds: [0, 1]        # Different seeds for w_0 and w_1

save_intermediate: true
save_freq: 50
lr: 0.0125
wd: 5e-4
use_test: true

use_wandb: true
project_name: "thesis-mode-connectivity"
