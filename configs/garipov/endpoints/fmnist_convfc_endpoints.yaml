defaults: []

experiment_name: "fmnist_convfc_endpoints"

output_root: "results/convfc/fmnist/endpoints/standard"

dataset: "FashionMNIST"
data_path: "./data"
transform: "VGG"
model: "ConvFC"

epochs: 200
save_intermediate: true   # If true, save checkpoints every save_freq epochs
save_freq: 50            # Only used if save_intermediate=true
lr: 0.05
wd: 5e-4
use_test: true

seeds: [0, 1]

use_wandb: true
project_name: "thesis-mode-connectivity"
