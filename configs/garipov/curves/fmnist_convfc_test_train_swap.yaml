defaults: []

experiment_name: "fmnist_convfc_curve_seed0-seed1_test_train_swap"

# Use existing trained checkpoint, just evaluate with different data split
output_root: "results/convfc/fmnist/curves/standard/seed0-seed1_bezier/checkpoints"

# Endpoints
endpoint0: "results/convfc/fmnist/endpoints/standard/seed0/checkpoint-200.pt"
endpoint1: "results/convfc/fmnist/endpoints/standard/seed1/checkpoint-200.pt"

dataset: "FashionMNIST"
data_path: "./data"
transform: "VGG"
model: "ConvFC"

# Curve parameters
curve: "Bezier"  # Bezier curve for mode connectivity
num_bends: 3  # 3 = start, middle, end

# Training
epochs: 200  # Using checkpoint-200
save_intermediate: true  # If true, save checkpoints every save_freq epochs
save_freq: 200           # Only used if save_intermediate=true
lr: 0.015  # Recommended LR for curve training
wd: 5e-4
seed: 0  # Random seed for reproducibility

use_test: true  # Uses combined+shuffled train/test split
use_wandb: true
project_name: "thesis-mode-connectivity"
