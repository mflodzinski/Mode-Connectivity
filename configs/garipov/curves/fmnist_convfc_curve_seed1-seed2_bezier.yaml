defaults: []

experiment_name: "fmnist_convfc_curve_seed1-seed2_bezier"

output_root: "results/convfc/fmnist/curves/standard/seed1-seed2_bezier/checkpoints"

# Endpoints
endpoint0: "results/convfc/fmnist/endpoints/standard/seed1/checkpoints/checkpoint-200.pt"
endpoint1: "results/convfc/fmnist/endpoints/standard/seed2/checkpoints/checkpoint-200.pt"

dataset: "FashionMNIST"
data_path: "./data"
transform: "VGG"
model: "ConvFC"

# Curve parameters
curve: "Bezier"  # or "PolyChain"
num_bends: 3  # 3 = start, middle, end

# Training
epochs: 200
save_intermediate: true  # If true, save checkpoints every save_freq epochs
save_freq: 200           # Only used if save_intermediate=true
lr: 0.015  # Recommended LR for curve training
wd: 5e-4    # NO REGULARIZATION - set to 0
seed: 0    # Random seed for reproducibility

use_test: true
use_wandb: true
project_name: "thesis-mode-connectivity"
