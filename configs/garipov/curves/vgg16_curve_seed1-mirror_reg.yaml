defaults: []

experiment_name: "garipov_vgg16_curve_seed1-mirror_reg"

output_root: "results/vgg16/cifar10/curves/standard/seed1-mirror_reg/checkpoints"

# Endpoints: seed1 original and its mirrored version
endpoint0: "results/vgg16/cifar10/endpoints/standard/seed1/checkpoints/checkpoint-200.pt"
endpoint1: "results/vgg16/cifar10/endpoints/standard/seed1_mirrored/checkpoints/checkpoint-200.pt"

dataset: "CIFAR10"
data_path: "./data"
transform: "VGG"
model: "VGG16"

# Curve parameters
curve: "Bezier"  # Bezier curve for mode connectivity
num_bends: 3  # 3 = start, middle, end

# Training
epochs: 200
save_intermediate: true
save_freq: 200
lr: 0.015  # Recommended LR for VGG16 curve training
wd: 5e-4    # WITH REGULARIZATION (L2 weight decay)
seed: 1    # Random seed for reproducibility

use_test: true
use_wandb: true
project_name: "thesis-mode-connectivity"
