defaults: []

data_path: "./data"
seed: 0
split_seed: 1
num_workers: 4

image_size: 32
val_fraction: 0.1
batch_size: 1000
num_eval_points: 50

sinkhorn_iters: 20
identity_init: true
scale_invariant: false
lambda_scale: 0.0
finetune_mode: "joint"
best_eval_interval: 2
validation_alpha_grid: [0.5]
early_stopping_patience: 4
early_stopping_min_delta: 1e-4
starting_alignment_artifact: null
starting_permutation_kind: hard
device: "auto"
log_interval: 10
start_index: 0
end_index: null
continue_on_error: true
